# Example nginx reverse-proxy config for CTFd behind Cloudflare.
# Replace every YOUR_DOMAIN with your hostname. Mount to /etc/nginx/nginx.conf.
#
# Highlights:
#  - Serves ONLY YOUR_DOMAIN. Direct-IP / unknown-host hits get 444 (HTTP) or
#    the TLS handshake rejected (HTTPS) — the origin never renders for a
#    foreign Host, so the IP can't be repurposed by another domain.
#  - Cloudflare real-IP restoration + X-Forwarded-Proto passthrough.
#  - ACME webroot is always served so Let's Encrypt renewals keep working.
worker_processes 4;
events { worker_connections 1024; }

http {
  upstream app_servers { server ctfd:8000; }

  map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
  }

  # Restore the real visitor IP from Cloudflare edge ranges.
  # Refresh from https://www.cloudflare.com/ips/ periodically.
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  gzip on;
  client_max_body_size 4G;

  # ---- Canonical host over HTTP (proxied by Cloudflare) ----
  server {
    listen 80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
    }

    location /events {                      # SSE for notifications
      proxy_pass http://app_servers;
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding off;
      proxy_buffering off;
      proxy_cache off;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
      proxy_pass http://app_servers;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
  }

  # ---- Canonical host over HTTPS (origin cert; use with Cloudflare Full/strict) ----
  server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    location /events {
      proxy_pass http://app_servers;
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding off;
      proxy_buffering off;
      proxy_cache off;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
      proxy_pass http://app_servers;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
  }

  # ---- Reject everything else ----
  # Unknown SNI / direct-IP HTTPS: drop the handshake with no certificate.
  server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
  }
  # Unknown Host over HTTP: serve only ACME, close everything else.
  server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; }
    location / { return 444; }
  }
}
